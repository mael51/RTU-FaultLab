name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cppcheck
      - name: Configure
        run: cmake -G Ninja -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test C++
        run: |
          cd build
          ./rtufaultlab_tests.exe
      - name: Format check
        shell: bash
        run: |
          # Pin the exact clang-format version so local and CI agree
          pip install clang-format==20.1.0
          find firmware tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 -r clang-format --dry-run --Werror
      - name: Static analysis (cppcheck)
        run: |
          set -o pipefail
          # exhaustive: avoids the normalCheckLevelMaxBranches informational
          # message that --error-exitcode would treat as a failure
          cppcheck --enable=warning,style,performance,portability --check-level=exhaustive --error-exitcode=1 firmware/ tests/ 2>&1 | tail -20
      - name: Python tests
        shell: bash
        run: |
          # UCRT64 DLLs must be reachable for the DUT host binary
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          pip install pytest pyyaml
          python -m pytest tests/integration tests/unit/test_bench_runner.py -q
      - name: Smoke campaign
        shell: bash
        run: |
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          python bench/runner/cli.py bench/campaigns/smoke.yaml --dut build/rtufaultlab_dut_host.exe --reports bench/reports
      - name: Robustness campaign
        if: success() || failure()
        shell: bash
        run: |
          # self-contained: installs its own deps so it can still run and
          # produce reports when an earlier step failed
          pip install pytest pyyaml
          export PATH="/c/msys64/ucrt64/bin:$PATH"
          python bench/runner/cli.py bench/campaigns/robustness.yaml --dut build/rtufaultlab_dut_host.exe --reports bench/reports
      - name: Upload campaign reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-reports
          path: bench/reports/
          if-no-files-found: ignore

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -G "Unix Makefiles" -DRTU_ENABLE_SANITIZERS=ON -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ./rtufaultlab_tests

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -G "Unix Makefiles" -DRTU_ENABLE_TSAN=ON -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ./rtufaultlab_tests

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get install -y lcov
      - name: Display toolchain
        run: |
          gcc --version | head -1
          gcov --version | head -1
          lcov --version | head -1
      - name: Configure
        run: cmake -G "Unix Makefiles" -DRTU_ENABLE_COVERAGE=ON -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ./rtufaultlab_tests
      - name: Check gcov data
        run: |
          echo "gcno files:"; find build -name '*.gcno' | wc -l
          echo "gcda files:"; find build -name '*.gcda' | wc -l
      - name: Capture coverage
        working-directory: build
        run: |
          # NOTE: no --no-external here: project sources live in the parent of
          # build/ and would all be classified as external and dropped (root
          # cause of the earlier empty-capture failures). Non-project files are
          # filtered explicitly by the next step. lcov 2.x needs explicit
          # ignore-errors for benign record classes; all other errors still
          # abort the step (no || true, no masking).
          lcov --capture --directory . --output-file coverage.raw.info \
               --rc geninfo_unexecuted_blocks=1 \
               --ignore-errors mismatch,unused,empty,unsupported,inconsistent \
               --verbose
      - name: Filter coverage
        working-directory: build
        run: |
          lcov --remove coverage.raw.info '/usr/*' '*/_deps/*' '*/tests/*' \
               --ignore-errors unused,unsupported \
               --output-file coverage.info
      - name: Verify coverage is not empty
        working-directory: build
        run: |
          n=$(grep -c '^SF:' coverage.info || true)
          echo "source files in coverage.info: $n"
          if [ "$n" -lt 1 ]; then
            echo "ERROR: coverage.info contains no source records" >&2
            exit 1
          fi
      - name: List coverage
        working-directory: build
        run: lcov --list coverage.info
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.info
          if-no-files-found: ignore
