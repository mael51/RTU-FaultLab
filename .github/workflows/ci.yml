name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cppcheck
      - name: Configure
        run: cmake -G Ninja -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test C++
        run: |
          cd build
          ./rtufaultlab_tests.exe
      - name: Format check
        run: |
          find firmware tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror
      - name: Static analysis (cppcheck)
        run: |
          set -o pipefail
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 firmware/ tests/ 2>&1 | tail -20
      - name: Python tests
        shell: bash
        run: |
          pip install pytest pyyaml
          python -m pytest tests/integration -q
      - name: Smoke campaign
        shell: bash
        run: |
          python bench/runner/cli.py bench/campaigns/smoke.yaml --dut build/rtufaultlab_dut_host.exe --reports bench/reports

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -G "Unix Makefiles" -DRTU_ENABLE_SANITIZERS=ON -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ./rtufaultlab_tests

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lcov
        run: sudo apt-get install -y lcov
      - name: Display toolchain
        run: |
          gcc --version | head -1
          gcov --version | head -1
          lcov --version | head -1
      - name: Configure
        run: cmake -G "Unix Makefiles" -DRTU_ENABLE_COVERAGE=ON -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: cd build && ./rtufaultlab_tests
      - name: Check gcov data
        run: |
          echo "gcno files:"; find build -name '*.gcno' | wc -l
          echo "gcda files:"; find build -name '*.gcda' | wc -l
      - name: Capture coverage
        working-directory: build
        run: |
          lcov --capture --directory . --output-file coverage.raw.info --verbose
      - name: Filter coverage
        working-directory: build
        run: |
          lcov --remove coverage.raw.info '/usr/*' '*/_deps/*' --output-file coverage.info
      - name: List coverage
        working-directory: build
        run: lcov --list coverage.info